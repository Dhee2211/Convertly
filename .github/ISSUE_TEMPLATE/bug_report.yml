name: Bug report
description: A wrong answer or something that is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you type, what did you see, and what did you expect? For wrong conversions, please include a source for the correct value.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
  - type: input
    id: browser
    attributes:
      label: Browser and version
